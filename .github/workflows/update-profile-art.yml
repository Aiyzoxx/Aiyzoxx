name: Update profile holo

"on":
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'assets/holo/**'
      - 'scripts/fetch_contributions.py'
      - 'scripts/render_holo_profile.py'
      - 'scripts/render_observatory.py'
      - 'scripts/requirements-holo.txt'
      - 'data/holo.json'
      - 'tests/**'
      - '.github/workflows/update-profile-art.yml'

permissions:
  contents: write

concurrency:
  group: profile-holo
  cancel-in-progress: false

jobs:
  holo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install animation verification dependency
        run: python -m pip install -r scripts/requirements-holo.txt
      - name: Verify motion, sources and calendar parsing
        run: python -m unittest discover -s tests -v
      - name: Fetch real public contribution data
        run: python scripts/fetch_contributions.py
      - name: Update profile ledger and links
        run: python scripts/render_holo_profile.py
      - name: Validate generated data and animation selection
        run: python -m unittest discover -s tests -v
      - name: Commit updated profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/contributions.json assets/holo/ledger.svg assets/holo/project-*.svg README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh profile holo ledger [skip ci]'
          git push
