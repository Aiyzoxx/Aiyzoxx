name: Validate desktop profile

"on":
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'assets/desktop/**'
      - 'scripts/render_desktop.py'
      - 'tests/**'
      - '.github/workflows/update-profile-art.yml'

permissions:
  contents: read

concurrency:
  group: profile-desktop
  cancel-in-progress: false

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency for preserved animation tests
        run: python -m pip install -r scripts/requirements-holo.txt
      - name: Validate desktop and preserved editions
        run: python -m unittest discover -s tests -v
      - name: Verify reproducible desktop assets
        run: |
          python scripts/render_desktop.py
          git diff --exit-code -- README.md assets/desktop
