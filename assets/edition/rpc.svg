<svg xmlns="http://www.w3.org/2000/svg" width="920" height="451" viewBox="0 0 920 451" role="img" aria-labelledby="title description"><title id="title">Antigravity RPC — editor activity to Discord Rich Presence</title><desc id="description">A workflow schematic, not a screenshot or live feed: Antigravity process activity is watched, translated and sent to Discord Rich Presence. The example status Project: Mint / Editing code is illustrative.</desc><style>@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}.draw{stroke-dasharray:1;animation:draw 1.8s ease-out both}.pulse{animation:breathe 4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.draw,.pulse{animation:none}}</style><rect x="0" y="0" width="920" height="451" fill="#f4f1e9" /><text x="36" y="33" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="400" fill="#234ad8" text-anchor="start" >03</text><text x="82" y="33" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="400" fill="#60655f" text-anchor="start" letter-spacing="0.6" >WORKFLOW AUTOMATION / PYTHON</text><text x="854" y="33" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="400" fill="#234ad8" text-anchor="end" >VIEW PROJECT</text><path d="M 868 35 L 883 20 M 868 20 H 883 V 35" fill="none" stroke="#234ad8" stroke-width="1.5" /><line x1="36" y1="52" x2="884" y2="52" stroke="#cfcec4" stroke-width="1" /><text x="36" y="124" font-family="Georgia, Times New Roman, serif" font-size="58" font-weight="400" fill="#202422" text-anchor="start" letter-spacing="-2" >Antigravity</text><text x="36" y="183" font-family="Georgia, Times New Roman, serif" font-size="58" font-weight="400" fill="#202422" text-anchor="start" letter-spacing="-2" >RPC</text><text x="38" y="230" font-family="Georgia, Times New Roman, serif" font-size="21" font-weight="400" fill="#202422" text-anchor="start" >A little more presence.</text><text x="38" y="275" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#60655f" text-anchor="start" >Project, tool and model activity,</text><text x="38" y="299" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#60655f" text-anchor="start" >automatically shared through Discord.</text><text x="38" y="354" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="400" fill="#202422" text-anchor="start" >PYTHON / PROCESS WATCHER / DISCORD</text><rect x="482" y="84" width="400" height="294" fill="#e2e7f7" /><text x="502" y="111" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="400" fill="#234ad8" text-anchor="start" letter-spacing="1" >EDITOR</text><text x="502" y="142" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="400" fill="#202422" text-anchor="start" >Antigravity.exe</text><line x1="501" y1="160" x2="861" y2="160" stroke="#cfcec4" stroke-width="1" /><text x="502" y="190" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="400" fill="#60655f" text-anchor="start" >WORKSPACE + TOOL + MODEL</text><path d="M 532 206 V 229 H 837" fill="none" stroke="#234ad8" stroke-width="1.5" class="draw" pathLength="1"/><circle cx="532" cy="229" r="3" fill="#234ad8" class="pulse"/><text x="570" y="220" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="400" fill="#234ad8" text-anchor="start" >watch / translate / update</text><text x="502" y="268" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="400" fill="#234ad8" text-anchor="start" letter-spacing="1" >DISCORD RICH PRESENCE</text><text x="502" y="300" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#202422" text-anchor="start" >Project: Mint</text><text x="502" y="327" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#60655f" text-anchor="start" >Editing code</text><text x="502" y="356" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="400" fill="#60655f" text-anchor="start" >Illustrative status / not a live session</text><line x1="36" y1="407" x2="884" y2="407" stroke="#cfcec4" stroke-width="1" /><text x="36" y="430" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="400" fill="#60655f" text-anchor="start" >FIG. 04 / WORKFLOW SCHEMATIC</text><text x="884" y="430" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="400" fill="#234ad8" text-anchor="end" >03 — ANTIGRAVITY RPC</text></svg>
