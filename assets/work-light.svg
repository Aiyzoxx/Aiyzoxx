<svg xmlns="http://www.w3.org/2000/svg" width="920" height="65" viewBox="0 0 920 65" role="img" aria-labelledby="title description"><title id="title">Selected public projects</title><desc id="description">Applications and automation projects by valthvn, including attributed forks.</desc><style>@keyframes trace{to{stroke-dashoffset:-160}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes enter{from{opacity:.25}to{opacity:1}}.trace{animation:trace 18s linear infinite}.orbit{animation:orbit 24s linear infinite;transform-origin:752px 161px}.enter{animation:enter 1.5s ease-out both}@media(prefers-reduced-motion:reduce){.trace,.orbit,.enter{animation:none}.orbit{display:none}}</style><rect width="920" height="65" fill="#faf9f6"/><text x="36" y="31" fill="#976020" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start">03</text><text x="70" y="31" fill="#62686a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" letter-spacing="1">SELECTED WORK</text><text x="884" y="31" fill="#62686a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="400" text-anchor="end">APPLICATIONS / AUTOMATION</text><line x1="36" y1="49" x2="884" y2="49" stroke="#deddd8" stroke-width="1" /></svg>
