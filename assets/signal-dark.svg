<svg xmlns="http://www.w3.org/2000/svg" width="920" height="378" viewBox="0 0 920 378" role="img" aria-labelledby="title description"><title id="title">Eight-week contribution signal</title><desc id="description">Each candle represents real daily counts in a Monday-based week: wick=min/max, body=first/last observed day, lower bar=weekly total. The last week can be partial. These are activity counts, not financial prices or a productivity score.</desc><style>@keyframes trace{to{stroke-dashoffset:-160}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes enter{from{opacity:.25}to{opacity:1}}.trace{animation:trace 18s linear infinite}.orbit{animation:orbit 24s linear infinite;transform-origin:752px 161px}.enter{animation:enter 1.5s ease-out both}@media(prefers-reduced-motion:reduce){.trace,.orbit,.enter{animation:none}.orbit{display:none}}</style><rect width="920" height="378" fill="#101113"/><text x="36" y="31" fill="#dfb06c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start">02</text><text x="70" y="31" fill="#a6a6a3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" letter-spacing="1">ACTIVITY SIGNAL</text><text x="884" y="31" fill="#a6a6a3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="400" text-anchor="end">8 WEEKS / DAILY RANGE</text><line x1="36" y1="49" x2="884" y2="49" stroke="#303235" stroke-width="1" /><text x="36" y="83" fill="#f0eee9" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">The rhythm behind the work.</text><line x1="70" y1="257.0" x2="593" y2="257.0" stroke="#303235" stroke-width="1" stroke-dasharray="2 6"/><text x="52" y="261.0" fill="#a6a6a3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="400" text-anchor="end">0</text><line x1="70" y1="183.5" x2="593" y2="183.5" stroke="#303