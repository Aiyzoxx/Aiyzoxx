<svg xmlns="http://www.w3.org/2000/svg" width="920" height="179" viewBox="0 0 920 179" role="img" aria-labelledby="title description"><title id="title">ValthvnQuota</title><desc id="description">Codex and Antigravity quotas, right in the taskbar. Fork of CodexQuota, with Antigravity support.</desc><style>@keyframes trace{to{stroke-dashoffset:-160}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes enter{from{opacity:.25}to{opacity:1}}.trace{animation:trace 18s linear infinite}.orbit{animation:orbit 24s linear infinite;transform-origin:752px 161px}.enter{animation:enter 1.5s ease-out both}@media(prefers-reduced-motion:reduce){.trace,.orbit,.enter{animation:none}.orbit{display:none}}</style><rect width="920" height="179" fill="#faf9f6"/><text x="36" y="33" fill="#976020" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start">02</text><text x="70" y="33" fill="#62686a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="400" text-anchor="start" letter-spacing="0.7">DEVELOPER TOOL</text><text x="70" y="66" fill="#202326" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="start">ValthvnQuota</text><text x="70" y="95" fill="#62686a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">Codex and Antigravity quotas, right in the taskbar.</text><text x="70" y="122" fill="#62686a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="400" text-anchor="start">Windows / WinUI 3 / local monitoring</text><text x="70" y="145" fill="#62686a" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" text-anchor="start">Fork of CodexQuota, with Antigravity support.</text><path d="M 848 51 L 866 33 M 849 33 L 866 33 L 866 50" fill="none" stroke="#976020" stroke-width="1.5" /><line x1="36" y1="165" x2="884" y2="165" stroke="#deddd8" stroke-width="1" /></svg>
